services:
  postgres:
    image: postgres:16
    container_name: sarc-db
    restart: always
    environment:
      POSTGRES_DB: sarcdb
      POSTGRES_USER: sarcuser
      POSTGRES_PASSWORD: sarcpass
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    networks:
      - sarc-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sarcuser -d sarcdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  eureka-server:
    build:
      context: ./eureka-server
      dockerfile: Dockerfile
    container_name: eureka-server
    ports:
      - "8761:8761"
    networks:
      - sarc-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  admin-service:
    build:
      context: ./class
      dockerfile: Dockerfile
    container_name: admin-service
    ports:
      - "8084:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/sarcdb
      - SPRING_DATASOURCE_USERNAME=sarcuser
      - SPRING_DATASOURCE_PASSWORD=sarcpass
      - SERVER_PORT=8081
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - sarc-network
    restart: unless-stopped

  user-service:
    build:
      context: ./user
      dockerfile: Dockerfile
    container_name: user-service
    ports:
      - "8085:8082"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/sarcdb
      - SPRING_DATASOURCE_USERNAME=sarcuser
      - SPRING_DATASOURCE_PASSWORD=sarcpass
      - SERVER_PORT=8082
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - sarc-network
    restart: unless-stopped

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
    depends_on:
      eureka-server:
        condition: service_healthy
      admin-service:
        condition: service_started
      user-service:
        condition: service_started
    networks:
      - sarc-network
    restart: unless-stopped

  prometheus:
    build:
      context: ./monitoring/prometheus
      dockerfile: Dockerfile
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - sarc-network
    restart: unless-stopped

  grafana:
    build:
      context: ./monitoring/grafana
      dockerfile: Dockerfile
    container_name: grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - sarc-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "3000:80"
    environment:
      - VITE_API_GATEWAY_URL=http://localhost:8080
    depends_on:
      - api-gateway
    networks:
      - sarc-network
    restart: unless-stopped

networks:
  sarc-network:
    driver: bridge

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
