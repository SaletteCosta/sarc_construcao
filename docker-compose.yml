services:
  postgres:
    image: postgres:16
    container_name: sarc-db
    restart: always
    environment:
      POSTGRES_DB: sarcdb
      POSTGRES_USER: sarcuser
      POSTGRES_PASSWORD: sarcpass
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    networks:
      - sarc-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sarcuser -d sarcdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  admin-service:
    build:
      context: ./class
      dockerfile: Dockerfile
    container_name: admin-service
    ports:
      - "8084:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/sarcdb
      - SPRING_DATASOURCE_USERNAME=sarcuser
      - SPRING_DATASOURCE_PASSWORD=sarcpass
      - SERVER_PORT=8081
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sarc-network
    restart: unless-stopped

  user-service:
    build:
      context: ./user
      dockerfile: Dockerfile
    container_name: user-service
    ports:
      - "8085:8082"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/sarcdb
      - SPRING_DATASOURCE_USERNAME=sarcuser
      - SPRING_DATASOURCE_PASSWORD=sarcpass
      - SERVER_PORT=8082
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sarc-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "3000:80"
    environment:
      - VITE_ADMIN_SERVICE_URL=http://localhost:8084
      - VITE_USER_SERVICE_URL=http://localhost:8085
    depends_on:
      - admin-service
      - user-service
    networks:
      - sarc-network
    restart: unless-stopped

networks:
  sarc-network:
    driver: bridge

volumes:
  postgres_data:
